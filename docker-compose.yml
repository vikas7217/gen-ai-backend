version: '3.9'

services:
  api:
    image: node:22-alpine
    container_name: node_api
    working_dir: /server

    volumes:
      - ./:/server

    ports:
      - "3000:3000"

    command: sh -c "npm install && npm run dev"

    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: